name: Compile ONR YIP concept PDFs
on:
  push:
    branches: [main]
    paths:
      - 'ONR/*/main.tex'
      - '.github/workflows/compile-onr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra poppler-utils
      - name: Compile four one-page concepts
        run: |
          set -e
          for d in predrag behzad morrison goolsby; do
            cd "ONR/$d"
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            pdfinfo main.pdf | grep -q 'Pages: *1' || { echo "$d must fit one page"; exit 1; }
            cd ../..
          done
      - name: Commit PDFs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ONR/predrag/main.pdf ONR/behzad/main.pdf ONR/morrison/main.pdf ONR/goolsby/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Compile ONR YIP one-page PDFs"
            git push
          fi
