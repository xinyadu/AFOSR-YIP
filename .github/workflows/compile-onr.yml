name: Compile ONR YIP concept PDFs
on:
  push:
    branches: [main]
    paths:
      - 'ONR/*/main.tex'
      - '.github/workflows/compile-onr.yml'
  workflow_dispatch:

concurrency:
  group: compile-onr-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra poppler-utils
      - name: Compile four one-page concepts
        run: |
          set -e
          for d in predrag behzad morrison goolsby; do
            cd "ONR/$d"
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            if grep -Fq 'Overfull \\hbox' main.log; then
              echo "$d contains overfull text; fix LaTeX layout before publishing"
              grep -F 'Overfull \\hbox' main.log
              exit 1
            fi
            pdftotext -bbox main.pdf - | python3 -c 'import re, sys; s=sys.stdin.read(); ys=[float(y) for y in re.findall(r"<word\\b[^>]*yMax=\"([0-9.]+)\"", s)]; print("Last text yMax (pt):", max(ys) if ys else "no text found")'
            pdfinfo main.pdf | grep -q 'Pages: *1' || { echo "$d must fit one page"; exit 1; }
            mv main.pdf "white_paper_${d}.pdf"
            cd ../..
          done
      - name: Commit descriptive PDFs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          for d in predrag behzad morrison goolsby; do
            git add -A -- "ONR/$d/white_paper_${d}.pdf"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Build named ONR YIP one-page PDFs"
            git push origin HEAD:main
          fi
